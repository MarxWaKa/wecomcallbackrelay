# 过滤外层 nginx 健康检查日志，避免 HEAD / 持续刷屏。
# 使用 $request_uri 而不是 $uri：try_files 内部重写会把 $uri 变成 /index.html。
map "$request_method $request_uri" $relay_loggable {
    "HEAD /"        0;
    "HEAD /healthz" 0;
    "GET /healthz"  0;
    default         1;
}

log_format relay_main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    # 仅记录非健康检查请求
    access_log /var/log/nginx/access.log relay_main if=$relay_loggable;

    # backend 端口与 docker-compose 的 BACKEND_PORT 保持一致（默认 8888）；
    # 修改 BACKEND_PORT 时必须同步修改此处并重建 frontend 镜像。
    location /api/ {
        proxy_pass http://backend:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /wecom/ {
        proxy_pass http://backend:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://backend:8888;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
