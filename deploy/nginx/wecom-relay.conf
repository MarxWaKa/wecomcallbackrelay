## wecom-callback-relay 外层 Nginx 反向代理
## Style: JC-NGINX / 参考现网外层 Nginx 配置
## 使用前请替换：
##   1) server_name                 实际域名
##   2) ssl_certificate             实际证书路径（相对路径基于 nginx prefix）
##   3) upstream server             前端容器所在主机:端口（默认 FRONTEND_PORT=8889）
##   4) allow/deny 网段              如有变化按实际办公网/VPN 调整
##
## 安全模型：
##   - /wecom/callback  公网开放，供企业微信回调（GET 验证 + POST 事件）
##   - /api/、/、/healthz  仅内网/VPN 可访问（管理后台）
##   如管理后台需要公网访问，注释掉 location / 与 /api/ 中的 allow/deny 即可。
##
## 依赖：若未安装 nginx_upstream_check_module，请注释掉 upstream 中的 check_* 指令。

upstream wecom_relay {
    hash $remote_addr consistent;
    # TODO 替换为实际前端容器地址：docker-compose 中 FRONTEND_PORT，默认 8889。
    # 若外层 nginx 与本项目同机，可改为 127.0.0.1:8889。
    server 10.0.0.10:8889 weight=1 max_fails=3 fail_timeout=10s;
    keepalive 300;

    # nginx_upstream_check_module 健康检查
    check interval=3000 rise=2 fall=5 timeout=2000 type=http;
    check_keepalive_requests 1;
    check_http_send "HEAD / HTTP/1.1\r\nHost: $server_addr\r\nConnection: keep-alive\r\n\r\n";
    check_http_expect_alive http_2xx http_3xx;
}



server {
    listen       443 ssl http2;
    server_name  wecomcallback.example.com;  # TODO 替换为实际域名

    # TODO 按实际证书路径调整；泛域名证书可直接复用
    ssl_certificate      cert/wildcard.example.com.cer;
    ssl_certificate_key  cert/wildcard.example.com.key;

    ssl_session_timeout 5m;
    ssl_session_cache shared:SSL:64m;
    ssl_session_tickets on;
    ssl_prefer_server_ciphers on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    server_tokens off;
    client_max_body_size 2m;

    # 安全响应头（HSTS 确认全站 HTTPS 后再打开）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;
    proxy_redirect        off;

    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;
    proxy_max_temp_file_size 100m;

    # 公共代理头（各 location 继承）
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Real-Port $remote_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root html;
    }

    # ============================================================
    # 企业微信回调入口：必须公网可访问，不要加 allow/deny
    # 支持 GET（URL 验证）与 POST（事件）
    # ============================================================
    location = /wecom/callback {
        proxy_pass http://wecom_relay;
        proxy_read_timeout 30s;
    }

    # ============================================================
    # 健康检查：仅内网
    # ============================================================
    location = /healthz {
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;

        proxy_pass http://wecom_relay;
        access_log off;
    }

    # ============================================================
    # 管理 API：仅内网/VPN；批量重推较慢，读超时放宽到 180s
    # ============================================================
    location /api/ {
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;

        if ($request_method ~* OPTIONS) {
            return 403;
        }

        proxy_pass http://wecom_relay;
        proxy_read_timeout 180s;
    }

    # ============================================================
    # 管理后台静态页面：仅内网/VPN
    # 如需公网访问管理后台，注释掉本节 allow/deny 与 OPTIONS 判断
    # ============================================================
    location / {
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;

        if ($request_method ~* OPTIONS) {
            return 403;
        }

        proxy_pass http://wecom_relay;
        proxy_read_timeout 60s;
    }
}
